<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
/>
</head>
<body>
    <main>
        <div class="taskbar">
            <div class="windowicon">
                <i class="ri-windows-fill"></i>
            </div>
            <div class="searchBox">
            <i class="ri-search-line"></i>
            <input type="search"  placeholder="Type here to search">
        </div>
        <div class="aferSearch box">
            <img  src="./aferSearch.png" alt="">
        </div>
        <div class="icons">
            <div class="box">
                <img src="https://static.wixstatic.com/media/38bfeb_49d29ac2ccde472dbb5fc629595024a1~mv2.png/v1/fill/w_280,h_280,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Microsoft_365_Copilot_Icon_svg.png" alt="">
            </div>
            <div class="box">
                <img src="./file.webp" alt="">
            </div>
            <div class="box">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Google_Chrome_icon_%28February_2022%29.svg/1024px-Google_Chrome_icon_%28February_2022%29.svg.png" alt="">
            </div>
            <div class="box">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Visual_Studio_Code_1.35_icon.svg/1200px-Visual_Studio_Code_1.35_icon.svg.png" alt="">
            </div>
            <div class="box">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/f5/Notepad_plus_plus.png" alt="">
            </div>
            </div>
            <div class="rightIcons">
                <div class="box">
                    <i class="ri-arrow-up-s-line"></i>
                </div>
                <div class="box">
                    <i class="ri-video-on-fill"></i>
                </div>
                <div class="box">
                    <i class="ri-battery-fill"></i>
                </div>
                <div class="box">
                    <i class="ri-wifi-line"></i>
                </div>
                <div class="box">
                    <i class="ri-volume-up-line"></i>
                </div>
                <div class="timeNdate">
                    <p id="time">time</p>
                    <p id="date">Date</p>
                </div>
            </div>
        </div>

        <div id="customMenu">
  <ul>
    <li>Refresh</li>
    <div class="line"></div>
    <li>Inspect</li>
    <div class="line"></div>
    <li>New Tab</li>
    <div class="line"></div>
    <li>Properties</li>
  </ul>
</div>
    </main>
    <script src="script.js"></script>
</body>
</html>
