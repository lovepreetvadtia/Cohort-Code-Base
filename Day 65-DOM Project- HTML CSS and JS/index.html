<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="theme">
            <p>Productivity Dashboard</p>
            <div class="button">
                <button>Change theme</button>
            </div>

        </div>
        <div class="city">
            <div class="time">
                <div class="upper">
                    <p>16 Dec, 2025</p>
                    <h3>Tuesday, 09:47 PM</h3>
                </div>
                <div class="bottom">
                    <h4>Sri Ganganagar, RJ</h4>
                </div>
            </div>
            <div class="weather">
                <div class="upper">
                    <h3>20°C</h3>
                    <p>Light rain</p>
                </div>
                <div class="down">
                    <p>Precipitation: 35%</p>
                    <p>Humidity: 49%</p>
                    <p>Wind: 10Km/h</p>
                </div>
            </div>
        </div>
        <div class="allElem">
            <div class="card elem1">
                <p>To Do List
                </p>
            </div>
            <div class="card elem2">
                <p>Daily Planner</p>
            </div>
            <div class="card elem3">
                <p>Motivation</p>
            </div>
            <div class="card elem4">
                <p>Pomodoro Timer</p>
            </div>
            <div class="card elem5">
                <p>Daily Goals</p>
            </div>
        </div>
        <div class="tools">

        <div class="todoList tool">
            <h2>Todo List</h2>
        </div>
        <div class="dailyPlanner tool">
            <h2>Daily Planner</h2>
        </div>
        <div class="motivation tool">
            <h2>Motivation</h2>
        </div>
        <div class="pomodoroTimer tool">
            <h2>Pomodora Timer</h2>
        </div>
        <div class="dailyGoals tool">
            <h2>Daily Goals</h2>
        </div>
    </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
